[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]

[project]
name = "cem"
version = "0.1"
description = "The Causal Evidence Model: Causal Instrument Discovery via Self-Instrumental Purification"
readme = "README.md"
keywords = [
  "adversarial-learning",
  "causal-discovery",
  "causal-inference",
  "instrument-discovery",
  "instrumental-variables",
  "jax",
  "machine-learning",
  "self-instrumental-purification"
]
license = "LicenseRef-Proprietary"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Neil Girdhar", email = "mistersheik@gmail.com" } ]
authors = [ { name = "Neil Girdhar", email = "mistersheik@gmail.com" } ]
requires-python = ">=3.15,<3.16"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "array-api-extra>=0.6",
  "datasets>=3.2",
  "efax>=2.4",
  "equinox>=0.13.7",
  "jax[cuda]>=0.9",
  "more-itertools>=10.6",
  "optuna>=4.2",
  "rich>=13.9.4",
  "scipy>=1.16",
  "threadpoolctl>=3.5",
  "tjax>=1.5.2",
  "typer>=0.15.1",
  "wandb>=0.19.4"
]
urls.Documentation = "https://github.com/NeilGirdhar/cem#readme"
urls.Issues = "https://github.com/NeilGirdhar/cem/issues"
urls.Source = "https://github.com/NeilGirdhar/cem"
scripts.optimize = "cem.commands.optimize:app"
scripts.sip-identification = "cem.commands.sip_identification:app"
scripts.supervised-missingness = "cem.commands.supervised_missingness:app"
scripts.visualize = "cem.commands.visualize:app"

[dependency-groups]
dev = [
  "jupyter>=1.1.1",
  "lefthook>=2",
  "pyproject-fmt>=2.30",
  "pyrefly>=1",
  "pytest>=8.3.4",
  "ruff>=0.16.5",
  "rumdl>=0.3",
  "taplo>=0.9",
  "ty>=0.0.80",
  "vulture>=2.14",
]

[tool.uv]
environments = [ "sys_platform == 'linux'" ]
build-backend.module-root = ""

[tool.ruff]
line-length = 100
lint.select = [ "ALL" ]
lint.ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "assert",
  "blanket-type-ignore",
  "commented-out-code",
  "docstring-extraneous-returns",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "float-equality-comparison",
  "line-contains-todo",
  "logging-f-string",
  "missing-copyright-notice",
  "missing-todo-author",
  "missing-todo-link",
  "missing-trailing-comma",
  "no-self-use",
  "pandas-use-of-dot-at",
  "parenthesize-chained-operators",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "unspecified-encoding",
  "unused-class-method-argument",
  "unused-function-argument",
  "unused-method-argument",
  "unused-static-method-argument"
]
lint.flake8-errmsg.max-string-length = 40
lint.flake8-import-conventions.extend-aliases."jax.numpy" = "jnp"
lint.flake8-import-conventions.extend-aliases."jax.random" = "jr"
lint.flake8-import-conventions.extend-aliases."jax.scipy.special" = "jss"
lint.flake8-import-conventions.extend-aliases."numpy.typing" = "npt"
lint.flake8-import-conventions.extend-aliases."optype.numpy" = "onp"
lint.flake8-import-conventions.extend-aliases."optype.numpy.compat" = "npc"
lint.flake8-import-conventions.extend-aliases."optype.typing" = "opt"
lint.flake8-import-conventions.extend-aliases."scipy.special" = "sc"
lint.flake8-import-conventions.extend-aliases.array_api_extra = "xpx"
lint.flake8-import-conventions.extend-aliases.ctypes = "ct"
lint.flake8-import-conventions.extend-aliases.datetime = "dt"
lint.flake8-import-conventions.extend-aliases.equinox = "eqx"
lint.flake8-import-conventions.extend-aliases.itertools = "it"
lint.flake8-import-conventions.extend-aliases.networkx = "nx"
lint.flake8-import-conventions.extend-aliases.optimistix = "optx"
lint.flake8-import-conventions.extend-aliases.optype = "op"
lint.flake8-import-conventions.extend-aliases.pyqtgraph = "pg"
lint.flake8-import-conventions.extend-aliases.seaborn = "sns"
lint.isort.combine-as-imports = true
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 8
lint.pylint.max-locals = 25
lint.preview = true

[tool.vulture]
ignore_decorators = [ "@cli.command", "@pytest.fixture" ]
sort_by_size = true

[tool.pyrefly]
project-includes = [ "**/*.ipynb", "**/*.py*" ]

[tool.pytest]
addopts = [ "--disable-warnings" ]
testpaths = [ "tests" ]
