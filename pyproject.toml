[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "jupyter>=1.1.1",
  "lefthook>=2",
  "pyrefly>=1.0",
  "pytest>=8.3.4",
  "ruff>=0.16.1",
  "toml-sort>=0.24",
  "ty>=0.0.66",
  "vulture>=2.14"
]

[project]
name = "cem"
version = "0.1"
description = "The Causal Evidence Model: Instrument Discovery via Adversarial Factor Purification with Evidence Phasors"
readme = "README.rst"
requires-python = ">=3.14, <3.15"
authors = [{name = "Neil Girdhar", email = "mistersheik@gmail.com"}]
maintainers = [{name = "Neil Girdhar", email = "mistersheik@gmail.com"}]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = [
  "adversarial-learning",
  "causal-discovery",
  "causal-inference",
  "instrument-discovery",
  "instrumental-variables",
  "jax",
  "machine-learning",
  "phasors"
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed"
]
dependencies = [
  "array-api-extra>=0.6.0",
  "datasets>=3.2.0",
  "efax>=2.4.0",
  "equinox>=0.13.7",
  "jax[cuda]>=0.9",
  "more-itertools>=10.6.0",
  "optuna>=4.2.0",
  "rich>=13.9.4",
  "scipy>=1.16",
  "threadpoolctl>=3.5.0",
  "tjax>=1.5.2",
  "typer>=0.15.1",
  "wandb>=0.19.4"
]

[project.scripts]
optimize = "cem.commands.optimize:app"
visualize = "cem.commands.visualize:app"

[project.urls]
Documentation = "https://github.com/NeilGirdhar/cem#readme"
Issues = "https://github.com/NeilGirdhar/cem/issues"
Source = "https://github.com/NeilGirdhar/cem"

[tool.pyrefly]
project-includes = [
  "**/*.ipynb",
  "**/*.py*"
]

[tool.pytest]
addopts = ["--disable-warnings"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "assert",
  "blanket-type-ignore",
  "commented-out-code",
  "docstring-extraneous-returns",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "float-equality-comparison",
  "line-contains-todo",
  "logging-f-string",
  "missing-copyright-notice",
  "missing-todo-author",
  "missing-todo-link",
  "missing-trailing-comma",
  "no-self-use",
  "pandas-use-of-dot-at",
  "parenthesize-chained-operators",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "unused-class-method-argument",
  "unused-function-argument",
  "unused-method-argument",
  "unused-static-method-argument"
]

[tool.ruff.lint.flake8-errmsg]
max-string-length = 40

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"array_api_extra" = "xpx"
"ctypes" = "ct"
"datetime" = "dt"
"equinox" = "eqx"
"itertools" = "it"
"jax.numpy" = "jnp"
"jax.random" = "jr"
"jax.scipy.special" = "jss"
"networkx" = "nx"
"numpy.typing" = "npt"
"optimistix" = "optx"
"optype" = "op"
"optype.numpy" = "onp"
"optype.numpy.compat" = "npc"
"optype.typing" = "opt"
"pyqtgraph" = "pg"
"scipy.special" = "sc"
"seaborn" = "sns"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-locals = 25

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.build-backend]
module-root = ""

[tool.vulture]
ignore_decorators = ["@cli.command", "@pytest.fixture"]
sort_by_size = true
